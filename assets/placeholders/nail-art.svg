<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Nail art placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4EFE8"/><stop offset=".55" stop-color="#E9D9DA"/><stop offset="1" stop-color="#D9C4C7"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B98F97"/><stop offset="1" stop-color="#70565D"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".25" r=".8">
      <stop offset="0" stop-color="#DCE8F0" stop-opacity=".9"/><stop offset="1" stop-color="#DCE8F0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <ellipse cx="230" cy="210" rx="360" ry="300" fill="url(#glow)"/>
  <!-- editorial nail fan -->
  <g transform="translate(400 560)">
    <g transform="rotate(-28)"><rect x="-58" y="-190" width="116" height="360" rx="58" fill="#FBF8F3" opacity=".92"/><rect x="-58" y="-190" width="116" height="150" rx="58" fill="url(#drop)"/></g>
    <g transform="rotate(-10)"><rect x="-58" y="-200" width="116" height="380" rx="58" fill="#FBF8F3" opacity=".95"/><rect x="-58" y="-200" width="116" height="150" rx="58" fill="#B9C8D4"/></g>
    <g transform="rotate(8)"><rect x="-58" y="-195" width="116" height="370" rx="58" fill="#FBF8F3"/><rect x="-58" y="-195" width="116" height="150" rx="58" fill="#C9B8C8"/></g>
    <g transform="rotate(26)"><rect x="-58" y="-185" width="116" height="350" rx="58" fill="#FBF8F3" opacity=".92"/><rect x="-58" y="-185" width="116" height="150" rx="58" fill="url(#drop)"/></g>
  </g>
  <!-- polish drops -->
  <g fill="url(#drop)"><circle cx="150" cy="830" r="34"/><circle cx="215" cy="870" r="20" opacity=".75"/><circle cx="620" cy="240" r="26" opacity=".6"/></g>
  <circle cx="660" cy="840" r="60" fill="none" stroke="#70565D" stroke-opacity=".25" stroke-width="2"/>
  <circle cx="660" cy="840" r="34" fill="#DCE8F0" opacity=".65"/>
  <path d="M110 150 q120 -70 240 0" stroke="#70565D" stroke-opacity=".3" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
